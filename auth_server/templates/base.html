<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}IAM Auth Server{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/css/iam.css">
  {% block head_extra %}{% endblock %}
</head>
<body class="iam-body">
  <main class="iam-wrapper">
    {% block content %}{% endblock %}
  </main>

  <script src="/static/js/iam.js" defer></script>
  <script src="/static/js/iam-validate.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
