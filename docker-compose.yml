services:
  auth_server:
    build:
      context: ./auth_server
    container_name: auth_server
    restart: always
    environment:
      # Database Connection
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-shared-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-auth_db}}
      # Redis Connection
      - REDIS_HOST=${REDIS_HOST:-shared-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # Public Application URLs (configure your live domains in Dokploy)
      - AUTH_SERVER_URL=${AUTH_SERVER_URL:-https://auth.example.com}
      - MANAGEMENT_URL=${MANAGEMENT_URL:-https://iam.example.com}
      # Security & JWT Secret Key
      - SECRET_KEY=${SECRET_KEY:-changeme_production_secret_key_12345}
      # Startup & OIDC Settings (set RESET_DB=false in production)
      - RESET_DB=${RESET_DB:-false}
      - BACKCHANNEL_LOGOUT_ENABLED=${BACKCHANNEL_LOGOUT_ENABLED:-false}
      # Global post-logout redirect URL (fallback when a client has no post_logout_redirect_uris)
      - POST_LOGOUT_REDIRECT_URL=${POST_LOGOUT_REDIRECT_URL:-https://dilipdangoriya.com.np}
      # Email Provider (SMTP or Brevo API)
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-smtp}
      - SMTP_HOST=${SMTP_HOST:-smtp-relay.brevo.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-false}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-admin@example.com}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-IAM}
    volumes:
      - auth_server_keys:/app/keys
    networks:
      - dokploy-network

  auth_server_management:
    build:
      context: ./auth_server_management
    container_name: auth_server_management
    restart: always
    environment:
      # Browser-facing URLs (public domains matching auth_server)
      - AUTH_SERVER_URL=${AUTH_SERVER_URL:-https://auth.example.com}
      - MANAGEMENT_URL=${MANAGEMENT_URL:-https://iam.example.com}
      - NEXT_PUBLIC_AUTH_SERVER_URL=${AUTH_SERVER_URL:-https://auth.example.com}
      - NEXT_PUBLIC_MANAGEMENT_URL=${MANAGEMENT_URL:-https://iam.example.com}
      # Server-side Internal URL (Docker network communication to auth_server)
      - AUTH_SERVER_INTERNAL_URL=http://auth_server:8000
      - HOSTNAME=0.0.0.0
      - PORT=3000
    depends_on:
      - auth_server
    networks:
      - dokploy-network

volumes:
  auth_server_keys:

networks:
  dokploy-network:
    external: true
