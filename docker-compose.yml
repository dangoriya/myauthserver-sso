services:
  postgresdb:
    image: pgvector/pgvector:pg15
    container_name: postgresdb
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-auth_db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: always
    env_file: .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgresdb:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  auth_server:
    build:
      context: ./auth_server
    container_name: auth_server
    restart: always
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      # Database — password sourced from .env for security
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD:-postgres}@postgresdb:${POSTGRES_PORT:-5432}/auth_db
      # Redis — host/port sourced from .env so external Redis can be configured in production
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      # App & redirect URLs
      - AUTH_SERVER_URL=http://localhost:8000
      - MANAGEMENT_URL=http://localhost:3005
      - CENTRAL_DASHBOARD_URL=http://localhost:3005
      - SUCCESSFUL_SIGNUP_REDIRECT_URL=http://localhost:3005
      - LOGOUT_REDIRECT_URL=http://localhost:3005
      # Startup behavior — set to false to preserve existing data
      - RESET_DB=true
      # ----- Email Provider -----
      # Options: "smtp" or "brevo_api"
      - EMAIL_PROVIDER=smtp
      - SMTP_HOST=smtp-relay.brevo.com
      - SMTP_PORT=587
      - SMTP_USER=${SMTP_USER:-b5f8a3001@smtp-brevo.com}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_TLS=true
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - EMAIL_FROM=dilipdangoriya@gmail.com
      - EMAIL_FROM_NAME=DilipDangoriya
      # Fallback secret key for JWT signing (should be overridden in production)
      - SECRET_KEY=${SECRET_KEY:-dev-only-secret-key-change-in-prod}
    volumes:
      - auth_server_keys:/app/keys
    depends_on:
      postgresdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      # Lets the OP reach client apps running on the host machine for
      # back-channel logout. Add other host names here as needed.
      - "host.docker.internal:host-gateway"

  auth_server_management:
    build:
      context: ./auth_server_management
    container_name: auth_server_management
    restart: always
    env_file: .env
    ports:
      - "3005:3000"
    environment:
      # Browser-facing URL (public).
      - NEXT_PUBLIC_AUTH_SERVER_URL=http://localhost:8000
      # Server-side URL: used by Next.js route handlers (e.g. back-channel
      # logout) to fetch the JWKS from inside the Docker network. Must be
      # the Docker service name, NOT localhost.
      - AUTH_SERVER_INTERNAL_URL=http://auth_server:8000
      # Issuer claim the auth server puts in its tokens (must match exactly
      # the `iss` value used by the OP).
      - AUTH_SERVER_ISSUER=http://localhost:8000
    depends_on:
      - auth_server
    extra_hosts:
      - "host.docker.internal:host-gateway"

  test_client_app1:
    build:
      context: ./test_client_app1
    container_name: test_client_app1
    restart: always
    env_file: .env
    ports:
      - "3001:3001"
    environment:
      # PUBLIC URL: the browser-facing auth_server address. The user types
      # http://localhost:3001 in their browser, then the test client
      # redirects them to http://localhost:8000/authorize. The browser
      # can't resolve `auth_server` over the Docker network, so this MUST
      # be the public localhost URL.
      - AUTH_SERVER_URL=http://localhost:8000
      # INTERNAL URL: server-to-server axios calls (token exchange,
      # userinfo, JWKS fetch). The Node process runs inside the Docker
      # network and can resolve the `auth_server` service name.
      - INTERNAL_AUTH_SERVER_URL=http://auth_server:8000
      - CLIENT_ID=test_client_id_1
      - CLIENT_SECRET=${CLIENT_SECRET:-test_client_secret_1}
      - REDIRECT_URI=http://localhost:3001/callback
      # Public URL the user's browser uses to reach this app (used to
      # build the post_logout_redirect_uri).
      - PUBLIC_BASE_URL=http://localhost:3001
    depends_on:
      - auth_server

volumes:
  postgres_data:
  redis_data:
  auth_server_keys:
