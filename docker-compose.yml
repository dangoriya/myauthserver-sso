services:
  auth_server:
    build:
      context: ./auth_server
    container_name: auth_server
    restart: always
    env_file: .env
    ports:
      - "${AUTH_SERVER_PORT:-9000}:8000"
    environment:
      # Database — password sourced from .env for security
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-shared-postgres-xcoeqe}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-auth_db}
      # Redis — host/port sourced from .env so external Redis can be configured in production
      - REDIS_HOST=${REDIS_HOST:-shared-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # App & redirect URLs
      - AUTH_SERVER_URL=${AUTH_SERVER_URL:-http://localhost:9000}
      - MANAGEMENT_URL=${MANAGEMENT_URL:-http://localhost:3005}
      # OIDC Back-Channel Logout 1.0 — set to "true" to enable global
      # back-channel logout to all clients with backchannel_logout_enabled=True
      - BACKCHANNEL_LOGOUT_ENABLED=false
      # Startup behavior — set to false to preserve existing data
      - RESET_DB=true
      # ----- Email Provider -----
      # Options: "smtp" or "brevo_api"
      - EMAIL_PROVIDER=smtp
      - SMTP_HOST=smtp-relay.brevo.com
      - SMTP_PORT=587
      - SMTP_USER=${SMTP_USER:-b5f8a3001@smtp-brevo.com}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_TLS=true
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - EMAIL_FROM=dilipdangoriya@gmail.com
      - EMAIL_FROM_NAME=IAM
      # Fallback secret key for JWT signing (should be overridden in production)
      - SECRET_KEY=${SECRET_KEY:-strong237811}
    volumes:
      - auth_server_keys:/app/keys
    networks:
      - dokploy-network

  auth_server_management:
    build:
      context: ./auth_server_management
    container_name: auth_server_management
    restart: always
    env_file: .env
    ports:
      - "3005:3000"
    environment:
      # Browser-facing URL (public).
      - NEXT_PUBLIC_AUTH_SERVER_URL=${AUTH_SERVER_URL:-http://localhost:9000}
      - NEXT_PUBLIC_MANAGEMENT_URL=${MANAGEMENT_URL:-http://localhost:3005}
      # Server-side URL: used by Next.js route handlers to fetch the JWKS
      # from inside the Docker network. Must be the Docker service name,
      # NOT localhost.
      - AUTH_SERVER_INTERNAL_URL=http://auth_server:8000
      - HOSTNAME=0.0.0.0
      - PORT=3000
    depends_on:
      - auth_server
    networks:
      - dokploy-network

  test_client_app1:
    build:
      context: ./test_client_app1
    container_name: test_client_app1
    restart: always
    env_file: .env
    ports:
      - "3001:3001"
    environment:
      # PUBLIC URL: the browser-facing auth_server address. The user types
      # http://localhost:3001 in their browser, then the test client
      # redirects them to http://localhost:9000/authorize. The browser
      # can't resolve `auth_server` over the Docker network, so this MUST
      # be the public URL.
      - AUTH_SERVER_URL=${AUTH_SERVER_URL:-http://localhost:9000}
      # INTERNAL URL: server-to-server axios calls (token exchange,
      # userinfo, JWKS fetch). The Node process runs inside the Docker
      # network and can resolve the `auth_server` service name.
      - INTERNAL_AUTH_SERVER_URL=http://auth_server:8000
      - CLIENT_ID=test_client_id_1
      - CLIENT_SECRET=${CLIENT_SECRET:-test_client_secret_1}
      - REDIRECT_URI=${CLIENT1_REDIRECT_URI:-http://localhost:3001/callback}
      # Public URL the user's browser uses to reach this app (used to
      # build the post_logout_redirect_uri).
      - PUBLIC_BASE_URL=${CLIENT1_URL:-http://localhost:3001}
    depends_on:
      - auth_server
    networks:
      - dokploy-network

volumes:
  auth_server_keys:

networks:
  dokploy-network:
    external: true
